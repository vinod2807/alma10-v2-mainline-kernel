name: check-upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.cmp.outputs.bump }}
      version: ${{ steps.korg.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch latest stable from kernel.org
        id: korg
        run: |
          python3 - <<'PY'
          import json, urllib.request, os, time
          url = "https://www.kernel.org/releases.json"
          last = None
          for attempt in range(3):
              try:
                  d = json.load(urllib.request.urlopen(url, timeout=30))
                  break
              except Exception as e:
                  last = e
                  print(f"attempt {attempt+1} failed: {e}")
                  time.sleep(5)
          else:
              raise SystemExit(f"kernel.org fetch failed: {last}")
          stable = [r for r in d["releases"] if r.get("moniker") == "stable"]
          if not stable:
              raise SystemExit("no stable release found in releases.json")
          ver = stable[0]["version"]
          print(f"latest={ver}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"latest={ver}\n")
          PY
      - name: Compare with VERSION
        id: cmp
        run: |
          cur=$(cat VERSION | tr -d ' \n')
          echo "current=$cur latest=${{ steps.korg.outputs.latest }}"
          if [ "$cur" != "${{ steps.korg.outputs.latest }}" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump VERSION, commit and tag
        id: bump
        if: steps.cmp.outputs.bump == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.korg.outputs.latest }}"
          cur=$(cat VERSION | tr -d ' \n')
          echo "$ver" > VERSION
          echo "bumping $cur -> $ver"

          # 1. Discover spec dynamically - never hardcode the filename.
          specs=(packaging/elrepo/kernel-ml-*.spec)
          if [ ! -f "${specs[0]}" ]; then
            echo "::error::no spec found matching packaging/elrepo/kernel-ml-*.spec"
            exit 1
          fi
          if [ "${#specs[@]}" -ne 1 ]; then
            echo "::error::ambiguous specs: ${specs[*]} - keep exactly one"
            exit 1
          fi
          SPEC="${specs[0]}"
          echo "SPEC=$SPEC"

          # 1b. Guard: .copr/Makefile must stay wildcard-based.
          if grep -qE '^SPEC\s*:?=.*kernel-ml-[0-9]' .copr/Makefile; then
            echo "::error::.copr/Makefile hardcodes a versioned spec - use wildcard discovery"
            exit 1
          fi

          # 2. ELRepo spec tracks version via '%global LKAver', not 'Version:'.
          if ! grep -qE '^%global LKAver ' "$SPEC"; then
            echo "::error::$SPEC has no '^%global LKAver ' line"
            exit 1
          fi
          sed -i -E "s/^%global LKAver .*/%global LKAver $ver/" "$SPEC"
          grep -E '^%global LKAver ' "$SPEC"

          # 3. Keep Source0 kernel major (v7.x / v8.x) in sync for future major bumps.
          #    Anchored to ^Source0: so changelog history is never rewritten.
          major="${ver%%.*}"
          sed -i -E "/^Source0:/ s@v[0-9]+\.x@v${major}.x@" "$SPEC"
          grep -E '^Source0:' "$SPEC"

          # 4. Roll config files forward: config-<old>-* -> config-<new>-*.
          rolled=""
          for f in packaging/elrepo/config-"$cur"-*; do
            [ -e "$f" ] || continue
            new="${f/$cur/$ver}"
            if [ ! -e "$new" ]; then
              cp -v "$f" "$new"
              rolled="$rolled $new"
            fi
          done
          if [ -z "$rolled" ] && ! ls packaging/elrepo/config-"$ver"-* >/dev/null 2>&1; then
            latest_cfg=$(ls -1 packaging/elrepo/config-*-x86_64 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest_cfg" ]; then
              cp -v "$latest_cfg" "packaging/elrepo/config-$ver-x86_64"
            else
              echo "::error::no config file to roll forward for $ver"
              exit 1
            fi
          fi
          ls -l packaging/elrepo/config-"$ver"-* || { echo "::error::missing config for $ver after roll"; exit 1; }

          # 4b. Heal config via olddefconfig (best-effort, never blocks the bump).
          # New kernels may introduce CONFIG_* options; fill defaults so the
          # spec's listnewconfig guard doesn't fail the 2h COPR build later.
          if ! command -v make >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc make bison flex libelf-dev bc openssl 2>&1 | tail -n 2 || true
          fi
          (
            set +e
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            cfg="packaging/elrepo/config-$ver-x86_64"
            major="${ver%%.*}"
            url="https://cdn.kernel.org/pub/linux/kernel/v${major}.x/linux-${ver}.tar.xz"
            echo "healing $cfg with $url"
            curl -sL --retry 3 -o "$tmp/linux.tar.xz" "$url" \
              && tar -xf "$tmp/linux.tar.xz" -C "$tmp" \
              && srcdir=$(echo "$tmp"/linux-*/ | head -n1) \
              && cp "$cfg" "$srcdir/.config" \
              && make -C "$srcdir" ARCH=x86_64 olddefconfig >/dev/null 2>&1 \
              && cp "$srcdir/.config" "$cfg" \
              && echo "config healed via olddefconfig" \
              || echo "::warning::olddefconfig heal skipped/failed - keeping rolled config as-is"
          )

          # 5. Validate before committing.
          grep -qF "%global LKAver $ver" "$SPEC"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION "$SPEC" packaging/elrepo/config-"$ver"-*
          git add -A packaging/elrepo || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump kernel to $ver"
          if git rev-parse "v$ver" >/dev/null 2>&1; then
            echo "tag v$ver already exists, skipping tag creation"
          else
            git tag "v$ver"
          fi
          git pull --rebase origin main || true
          git push origin HEAD:main
          git push origin "v$ver" || true
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Cancel superseded COPR builds (keep newest)
        if: steps.bump.outputs.pushed == 'true'
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_LOGIN:-}" ] || [ -z "${COPR_TOKEN:-}" ]; then
            echo "::warning::COPR_LOGIN/COPR_TOKEN secrets not set - skipping auto-cancel. Add them to enable."
            exit 0
          fi
          pip install -q copr-cli
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = vinod2807\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' "$COPR_LOGIN" "$COPR_TOKEN" > ~/.config/copr
          chmod 600 ~/.config/copr
          ver="${{ steps.korg.outputs.latest }}"
          python3 - <<PY
          import json, subprocess, urllib.request
          url = "https://copr.fedorainfracloud.org/api_3/build/list?ownername=vinod2807&projectname=alma10-v2-mainline-kernel&limit=10"
          d = json.load(urllib.request.urlopen(url, timeout=30))
          running = [b for b in d.get("items", []) if b.get("state") == "running"]
          # keep newest running build, cancel older ones for the same version
          same = sorted([b for b in running if b.get("source_package", {}).get("version", "").startswith("${ver}")], key=lambda b: b["id"])
          for b in same[:-1]:
              print(f"cancelling superseded build {b['id']}")
              subprocess.run(["copr-cli", "cancel", str(b["id"])], check=False)
          print(f"kept newest: {[b['id'] for b in same[-1:]]}, total running: {len(running)}")
          PY

  notify-on-failure:
    needs: [check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open issue on check-upstream failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="check-upstream failed: $(date -u +%F)"
          if gh issue list --search "$title" --state open --json number --jq length | grep -q '^0'; then
            gh issue create --title "$title" --body "Run failed: $run_url — check bump step logs, fix, re-run workflow_dispatch." --label "bug,automation" || \
            gh issue create --title "$title" --body "Run failed: $run_url"
          else
            echo "issue already open, skipping"
          fi
