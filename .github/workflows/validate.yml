name: validate

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-srpm:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validators
        run: |
          set +e
          dnf install -y epel-release 2>&1 | tail -n 1 || true
          dnf install -y dnf-plugins-core 2>&1 | tail -n 1 || true
          dnf config-manager --set-enabled crb 2>&1 | tail -n 1 || true
          dnf install -y rpm-build rpmdevtools python3-pyyaml python3-pip gcc make bison flex elfutils-libelf-devel openssl-devel bc findutils 2>&1 | tail -n 3
          dnf install -y shellcheck spectool 2>&1 | tail -n 1 || echo "::warning::shellcheck/spectool not available"
          python3 -m pip install -q yamllint 2>&1 | tail -n 1 || pip3 install -q yamllint 2>&1 | tail -n 1 || echo "::warning::yamllint install failed"
          command -v rpmspec && echo "rpmspec ready"
          command -v yamllint || python3 -m yamllint --version || echo "::warning::yamllint missing - lint step will skip"
          command -v spectool || echo "::warning::spectool missing - SRPM step uses curl fallback"
          command -v shellcheck || echo "::warning::shellcheck missing - lint continues"
          exit 0

      - name: Lint workflows
        run: |
          set +e
          if command -v yamllint >/dev/null 2>&1; then
            yamllint -d '{extends: default, rules: {line-length: {max: 140}, truthy: disable}}' .github/workflows/*.yml || echo "::warning::yamllint found issues"
          elif python3 -m yamllint --version >/dev/null 2>&1; then
            python3 -m yamllint -d '{extends: default, rules: {line-length: {max: 140}, truthy: disable}}' .github/workflows/*.yml || echo "::warning::yamllint found issues"
          else
            echo "::warning::yamllint not available - skipping YAML lint"
          fi
          if ls scripts/*.sh packaging/elrepo/*.sh >/dev/null 2>&1; then
            if command -v shellcheck >/dev/null 2>&1; then
              shellcheck -S warning scripts/*.sh packaging/elrepo/*.sh || echo "::warning::shellcheck findings"
            else
              bash -n scripts/*.sh 2>&1 | head -n 5 || true
              echo "::warning::shellcheck missing - did bash -n only"
            fi
          fi
          exit 0

      - name: Single-spec guard (no hardcoded versioned path)
        run: |
          set -euo pipefail
          count=$(ls packaging/elrepo/kernel-ml-*.spec 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 spec matching packaging/elrepo/kernel-ml-*.spec, found $count"
            ls -l packaging/elrepo/
            exit 1
          fi
          SPEC=$(ls packaging/elrepo/kernel-ml-*.spec)
          echo "SPEC=$SPEC"
          # .copr/Makefile must stay wildcard-based so renames don't break COPR
          if grep -qE '^SPEC\s*:?=.*kernel-ml-[0-9]' .copr/Makefile; then
            echo "::error::.copr/Makefile hardcodes a versioned spec path - use wildcard discovery"
            exit 1
          fi
          # VERSION must match LKAver
          ver=$(cat VERSION | tr -d ' \n')
          lkaver=$(grep -E '^%global LKAver ' "$SPEC" | awk '{print $3}')
          echo "VERSION=$ver LKAver=$lkaver"
          if [ "$ver" != "$lkaver" ]; then
            echo "::error::VERSION ($ver) != LKAver ($lkaver)"
            exit 1
          fi
          # config for VERSION must exist
          if ! ls packaging/elrepo/config-"$ver"-* >/dev/null 2>&1; then
            echo "::error::missing packaging/elrepo/config-$ver-* for VERSION $ver"
            ls -l packaging/elrepo/config-* || true
            exit 1
          fi

      - name: rpmspec parse check
        run: |
          set -euo pipefail
          SPEC=$(ls packaging/elrepo/kernel-ml-*.spec)
          rpmspec -q --srpm --define "_topdir /tmp/rpmcheck" "$SPEC" 2>&1 | head -n 20
          echo "rpmspec parse OK: $SPEC"

      - name: SRPM smoke test (no full compile)
        run: |
          set -euo pipefail
          make -f .copr/Makefile srpm outdir=/tmp/srpm-out 2>&1 | tail -n 15
          ls -lh /tmp/srpm-out/*.src.rpm
          echo "SRPM smoke OK"
